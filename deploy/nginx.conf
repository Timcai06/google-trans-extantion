server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  location /v1/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_read_timeout 35s;
  }
  location = /health {
    proxy_pass http://api:8787;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff;
  }
}
