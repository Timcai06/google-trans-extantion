services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:4173}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      TRANSLATION_API_URL: ${TRANSLATION_API_URL:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-4o-mini}
      TRANSLATION_TIMEOUT_MS: ${TRANSLATION_TIMEOUT_MS:-10000}
    volumes:
      - api-data:/data
    security_opt:
      - no-new-privileges:true
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  api-data:
