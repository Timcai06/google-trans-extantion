<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystic Tarot</title>
    <style>
      /* CRT EFFECTS - Custom styles not in Tailwind */
      
      /* 1. Stronger Scanlines - Opacity Reduced for Brightness */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 3px;
        z-index: 9998;
        pointer-events: none;
        opacity: 0.3; /* Reduced from 0.6 for brightness */
      }

      /* 2. Vignette (Dark Corners) - Lighter */
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 90%, rgba(0,0,0,0.7) 100%);
        z-index: 9999;
        pointer-events: none;
      }

      /* 3. Screen Flicker */
      @keyframes screen-flicker {
        0% { opacity: 0.03; }
        5% { opacity: 0.06; }
        10% { opacity: 0.03; }
        15% { opacity: 0.07; }
        20% { opacity: 0.03; }
        25% { opacity: 0.03; }
        30% { opacity: 0.03; }
        35% { opacity: 0.02; }
        40% { opacity: 0.03; }
        45% { opacity: 0.06; }
        50% { opacity: 0.03; }
        55% { opacity: 0.07; }
        60% { opacity: 0.03; }
        65% { opacity: 0.03; }
        70% { opacity: 0.02; }
        75% { opacity: 0.03; }
        80% { opacity: 0.06; }
        85% { opacity: 0.03; }
        90% { opacity: 0.07; }
        95% { opacity: 0.03; }
        100% { opacity: 0.03; }
      }

      .crt-flicker-overlay {
        position: fixed;
        inset: 0;
        background: white;
        pointer-events: none;
        z-index: 9997;
        mix-blend-mode: overlay;
        animation: screen-flicker 0.15s infinite;
        opacity: 0.5; /* Added baseline opacity to brighten overall scene */
      }
    </style>

  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style.css">
</head>
  <body>
    <div id="root"></div>
    <!-- Global CRT Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="crt-flicker-overlay"></div>
  </body>
</html>
